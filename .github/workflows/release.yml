name: Package Update Source

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    name: Test Kernel Module Build (in Docker) - Ubuntu ${{ matrix.ubuntu_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_version: ["25.04", "25.10", "26.04"]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Replace Ubuntu version in Dockerfile
        run: sed -i "s/^FROM ubuntu:.*/FROM ubuntu:${{ matrix.ubuntu_version }}/" Dockerfile

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: test:${{ github.sha }}-ubuntu${{ matrix.ubuntu_version }}
          push: false

  package-and-deploy:
    name: Build, Sign, and Deploy APT Repository
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install Debian Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Create Debian Directory Layout
        run: |
          mkdir -p build/sane-mac80211_1.0_all/usr/src/sane-mac80211-1.0
          mkdir -p build/sane-mac80211_1.0_all/DEBIAN

          cp DEBIAN/* build/sane-mac80211_1.0_all/DEBIAN/
          cp dkms.conf Makefile patch-mlme.patch build/sane-mac80211_1.0_all/usr/src/sane-mac80211-1.0/

      - name: Generate Post-Install Actions
        run: |
          cat << 'EOF' > build/sane-mac80211_1.0_all/DEBIAN/postinst
          #!/bin/sh
          set -e
          dkms add -m sane-mac80211 -v 1.0 || true
          dkms build -m sane-mac80211 -v 1.0
          dkms install -m sane-mac80211 -v 1.0 --force
          EOF
          chmod +x build/sane-mac80211_1.0_all/DEBIAN/postinst

      - name: Generate Pre-Removal Actions
        run: |
          cat << 'EOF' > build/sane-mac80211_1.0_all/DEBIAN/prerm
          #!/bin/sh
          set -e
          dkms remove -m sane-mac80211 -v 1.0 --all || true
          EOF
          chmod +x build/sane-mac80211_1.0_all/DEBIAN/prerm

      - name: Build Debian Package
        run: |
          dpkg-deb --build build/sane-mac80211_1.0_all
          mkdir repo-dist
          mv build/sane-mac80211_1.0_all.deb repo-dist/

      - name: Setup GPG Environment
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
          echo "${{ secrets.GPG_PUBLIC_KEY }}" > public.key

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          gpg --batch --import private.key
          rm -f private.key

      - name: Generate APT Indexes and Sign Repository
        run: |
          cd repo-dist
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages

          apt-ftparchive release . > Release

          gpg --batch --yes --clearsign --digest-algo SHA256 -o InRelease Release

          gpg --batch --yes -abs --digest-algo SHA256 -o Release.gpg Release

          cp ../public.key public.gpg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo-dist
